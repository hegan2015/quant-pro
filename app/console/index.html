<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quant-pro 控制台</title>
<link rel="stylesheet" href="vendor/element-plus.css">
<link rel="stylesheet" href="vendor/element-plus-dark.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 只保留首屏防闪白：布局与配色一律由 assets/app.css 提供。
     这里曾复制过一份旧版 .qp-top/.qp-shell/.qp-nav/.qp-foot 规则，内联优先级压过
     样式表，导致暗色终端的骨架（状态栏高度、导航宽度、吸顶偏移）始终被旧值覆盖。 */
  body{background:var(--bg-1)}
</style>
</head>
<body>
<script>
/* 主题先于渲染落地，避免闪白；默认暗色（金融终端），亮色可切换并记忆 */
(function () {
  var t = localStorage.getItem("qp_theme") || "dark";
  document.documentElement.setAttribute("data-theme", t);
  document.documentElement.classList.toggle("dark", t === "dark");
})();
</script>
<div id="app"></div>
<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/element-plus.full.min.js"></script>
<script src="vendor/element-plus-zh-cn.js"></script>
<script src="app.js"></script>
</body>
</html>
