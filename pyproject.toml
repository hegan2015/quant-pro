[project]
name = "quant-pro"
version = "0.1.0"
description = "A股日线智能量化系统：数据 → 因子 → 策略 → 回测 → 绩效 → 信号"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "duckdb>=1.0",
    "pyarrow>=15",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quant = "app.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: 需要 TimescaleDB 容器",
    "network: 需要外网数据源",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["core", "app"]
